name: Build Dual Cam APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: android-actions/setup-android@v3

      - name: Reconstruct large source files
        run: |
          python3 << 'PY'
          import base64, gzip
          from pathlib import Path
          def restore(b64path, outpath):
              data = gzip.decompress(base64.b64decode(Path(b64path).read_text().strip()))
              Path(outpath).parent.mkdir(parents=True, exist_ok=True)
              Path(outpath).write_bytes(data)
              print(f"restored {outpath} ({len(data)} bytes)")
          Path("MainActivity.kt.b64").write_text(
              Path("main.b64.1").read_text().strip() + Path("main.b64.2").read_text().strip()
          )
          restore("MainActivity.kt.b64", "app/src/main/java/com/rahol/dualcam/MainActivity.kt")
          restore("activity_main.xml.b64", "app/src/main/res/layout/activity_main.xml")
          PY

      - name: Setup Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
            unzip -q gradle.zip
            ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dual-cam-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
